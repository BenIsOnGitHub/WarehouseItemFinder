<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warehouse Item Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="/manifest.json">
<link rel="icon" sizes="192x192" href="/icon-192.png">
<link rel="icon" sizes="512x512" href="/icon-512.png">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- App Navigation Bar -->
<header class="app-header">
  <div class="header-left">
    <!-- Icon on the far left -->
    <img src="images/icon-192-square.png" alt="Logo" class="header-logo" />
    
    <div class="header-title-container">
      <h1 class="app-title">Warehouse Item Finder</h1>
      
      <!-- Clickable Warehouse Selector Text -->
      <button type="button" id="warehouse-selector-btn" class="warehouse-selector-btn">
        <span id="active-warehouse-text">Set Warehouse</span>
      </button>

      <!-- Hidden Search Bar Popover Container -->
      <div id="warehouse-search-popover" class="warehouse-search-popover" hidden>
        <input 
          type="text" 
          id="warehouse-search-input" 
          placeholder="Set Warehouse" 
          autocomplete="off"
        />
        <ul id="warehouse-search-results" class="warehouse-dropdown-list" hidden></ul>
      </div>
    </div>
  </div>
  <button class="hamburger-btn" id="menuToggle" aria-label="Open Navigation Menu">&#9776;</button>

  <div class="nav-dropdown" id="navDropdown">
    <button onclick="switchView('search-view'); resetSearchView();">Search Products</button>
    <button onclick="switchView('browse-view'); startBrowse(1);">Browse Products</button>
    <button onclick="showFavoritesView()">My Favorite Products</button> 
  </div>
</header>

<div class="container">

  <!-- View 1: Product Search (Default) -->
  <section id="search-view" class="page-view active">
    <h1>Search</h1>
    
<div class="search-container">
  <!-- Radio Option Selectors -->
  <div class="search-mode-group">
    
    <label class="radio-label">
      <input type="radio" name="searchMode" value="product_name" checked> Name
    </label>
    <label class="radio-label">
      <input type="radio" name="searchMode" value="item_number"> Item #
    </label>
    <label class="radio-label">
      <input type="radio" name="searchMode" value="sku"> SKU
    </label>
  </div>

  <!-- Search Input & Button -->
  <div class="search-input-group">
    <div class="input-with-mic">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Enter here ... " 
        autocomplete="off"
        inputmode="numeric"
      />
      <!-- Barcode Button (hidden by default) -->
    <button 
      id="barcodeBtn" 
      type="button" 
      title="Scan SKU barcode" 
      aria-label="Scan SKU barcode"
      style="display: none;"
    >
      &#128247; <!-- Camera icon / Barcode emoji -->
    </button>
      <button id="micBtn" type="button" title="Search by voice" aria-label="Search by voice">
        &#127908;
      </button>
    </div>
    <button id="search-btn" class="btn btn-primary" type="button">Search</button>
  </div>
</div>
    
    
    <!-- Install UI -->
    <div id="installContainer" style="display:none;">
      <button id="installBtn" style="display:none;">Install App</button>
      <div id="installHint">To install app on iPhone, tap the share button and scroll to 'Add to Home Screen'</div>
    </div>
    
    <div id="count"></div>
    <ul id="results"></ul>
  </section>

  <!-- View 2: Favorites List -->
  <section id="favorites-view" class="page-view">
    <h1>My Favorite Products</h1>
    <div id="favCount"></div>
    <ul id="favoritesList"></ul>
  </section>

  <!-- View 3: Browse Products -->
  <section id="browse-view" class="page-view">
    <h1>Browse</h1>

<!-- Sort & Filter Control Bar -->
    <div class="browse-controls-bar" style="margin: 15px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="browseSortSelect" style="font-weight: 600; font-size: 14px; color: #555;">Sort By</label>
        <select id="browseSortSelect" onchange="onBrowseSortChange(this.value)" style="padding: 6px 10px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; background-color: #fff; cursor: pointer;">
          <option value="name">Name</option>
          <option value="category">Category</option>
          <option value="aisle">Aisle</option>
          <option value="item_number">Item Number</option>
          <option value="sku">SKU</option>
          <option value="updated_at">Date Updated</option>
        </select>
      </div>

      <button id="openFilterBtn" class="toggle-btn" onclick="toggleFilterDrawer(true)" style="padding: 6px 14px; cursor: pointer;">
        Filter &#9881;
      </button>
    </div>

    <div id="browseContent">
      <!-- Top Pagination Block -->
      <div class="pagination-wrapper" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 12px;">
        <div class="pagination-controls">
          <button class="top-prev5-btn browse-cat-btn" onclick="changeBrowsePage(-5)">-5 &laquo;</button>
          <button class="top-prev-btn browse-cat-btn" onclick="changeBrowsePage(-1)">Prev &lsaquo;</button>
          <button class="top-next-btn browse-cat-btn" onclick="changeBrowsePage(1)">Next &rsaquo;</button>
          <button class="top-next5-btn browse-cat-btn" onclick="changeBrowsePage(5)">+5 &raquo;</button>
        </div>
      </div>
      
      <div class="pageIndicatorTop page-indicator-text"></div>
      
      <div id="activeFilterChips" class="filter-chips-container"></div>
      
      <div id="browseListContainer" style="margin-top: 15px;"></div>
      
      <!-- Bottom Pagination Block -->
      <div class="pagination-wrapper">
        <div class="pageIndicatorBottom page-indicator-text"></div>
        <div class="pagination-controls">
          <button class="bottom-prev5-btn browse-cat-btn" onclick="changeBrowsePage(-5, true)">&laquo;</button>
          <button class="bottom-prev-btn browse-cat-btn" onclick="changeBrowsePage(-1, true)">&lsaquo;</button>
          <button class="bottom-next-btn browse-cat-btn" onclick="changeBrowsePage(1, true)">&rsaquo;</button>
          <button class="bottom-next5-btn browse-cat-btn" onclick="changeBrowsePage(5, true)">&raquo;</button>
        </div>
      </div>
    </div>
  </section>
  

  
</div>

<script src="warehousePicker.js"></script>
<script src="app.js"></script>


  <!-- Location Help Modal -->
  <div id="helpModal" class="modal-overlay" onclick="closeHelpModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeHelpModal()">&times;</button>
      <img src="images/help.jpg" alt="Aisle and Bay Location Guide" class="help-image">
    </div>
  </div>

<!-- Filter Drawer Overlay & Panel -->
  <div id="filterDrawerBackdrop" class="drawer-backdrop" onclick="toggleFilterDrawer(false)" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000;"></div>
  
  <div id="filterDrawer" class="drawer-panel" style="position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #fff; box-shadow: -2px 0 8px rgba(0,0,0,0.2); z-index: 1001; transition: right 0.3s ease; display: flex; flex-direction: column;">
    <div style="padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0; font-size: 18px;">Filter Products</h3>
      <button onclick="toggleFilterDrawer(false)" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
    </div>

    <div style="padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">
      <div>
        <label for="filterCategorySelect" style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #444;">Subcategory</label>
        <select id="filterCategorySelect" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
          <option value="">All Subcategories</option>
        </select>
      </div>

      <div>
        <label for="filterAisleSelect" style="display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #444;">Aisle</label>
        <select id="filterAisleSelect" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;" onchange="onAisleFilterChange(this.value)">
          <option value="">All Aisles</option>
        </select>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
        <input type="checkbox" id="showReportedCheckbox" style="width: 18px; height: 18px; cursor: pointer;" onchange="onToggleIncorrectFilter(this.checked)">
        <label for="showReportedCheckbox" style="font-size: 14px; cursor: pointer;">Show products reported as incorrect</label>
      </div>
    </div>

    <div style="padding: 16px; border-top: 1px solid #eee; display: flex; gap: 10px;">
      <button onclick="resetFilters()" style="flex: 1; padding: 10px; border: 1px solid #ccc; background: #f5f5f5; border-radius: 6px; cursor: pointer;">Reset</button>
      <button onclick="applyFilters()" style="flex: 1; padding: 10px; border: none; background: #0070d2; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer;">Apply</button>
    </div>
  </div>

<template id="product-card-template">
  <div class="product-card" data-id="">
    <div class="product-header">
      <h3 class="product-title"></h3>
      <span class="product-identifier"></span>
    </div>
    
    <div class="location-container">
      <span class="status-badge"></span>
    </div>
    
    <button class="btn-update-location" type="button">Update Location</button>
  </div>
</template>

<div id="skuChoiceModal" class="custom-modal-backdrop" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;">
  <div class="custom-modal-content" style="background: white; padding: 20px; border-radius: 8px; text-align: center; max-width: 300px; width: 100%;">
    <p style="margin-bottom: 20px; font-weight: 600;">Choose SKU entry method:</p>
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button id="skuCameraBtn" class="btn btn-primary" style="padding: 10px 15px;">Camera</button>
      <button id="skuManualBtn" class="btn btn-secondary" style="padding: 10px 15px;">Manual</button>
    </div>
  </div>
</div>

</body>
</html>
